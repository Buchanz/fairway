<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:14px system-ui;color:#183c32;background:#f5f6f2}#map{height:360px}#info{padding:12px;min-height:48px}button{margin:8px;padding:12px;border:0;border-radius:10px;background:#183c32;color:white}a{color:#183c32}</style></head><body><div id="map"></div><button id="gps">Use my GPS</button><button id="reset">Clear target</button><div id="info">Tap a target on the map, then enable GPS. Distances are approximate; hole and green positions are not verified.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const q=new URLSearchParams(location.search),lat=Number(q.get('lat')),lng=Number(q.get('lng'));
const centre=Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180?[lat,lng]:[48.4549,-123.345];
const info=document.getElementById('info');let target,marker,here,accuracy,line,watch,position;
const map=L.map('map').setView(centre,16);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap contributors</a>'}).addTo(map).on('tileerror',()=>{info.textContent='Map tiles unavailable. Check your connection.';});
function draw(){if(line)map.removeLayer(line);if(target&&position){const age=Date.now()-position.timestamp;if(age>30000){info.textContent='GPS is stale. Wait for a fresh location.';return;}const m=map.distance(position.coords,target);info.textContent=Math.round(m/0.9144)+' yd · '+Math.round(m)+' m to selected target. GPS accuracy ±'+Math.round(position.accuracy)+' m.';line=L.polyline([position.coords,target],{color:'#183c32'}).addTo(map);}else info.textContent=target?'Target selected. Enable GPS to measure from your position.':'Tap a target on the map. Green positions are not verified.';}
map.on('click',e=>{target=e.latlng;if(marker)map.removeLayer(marker);marker=L.circleMarker(target,{radius:8,color:'#bd793d'}).addTo(map);draw();});
document.getElementById('reset').onclick=()=>{target=null;if(marker)map.removeLayer(marker);draw();};
document.getElementById('gps').onclick=()=>{if(watch!==undefined){navigator.geolocation.clearWatch(watch);watch=undefined;position=null;if(here)map.removeLayer(here);if(accuracy)map.removeLayer(accuracy);document.getElementById('gps').textContent='Use my GPS';draw();return;}if(!navigator.geolocation){info.textContent='GPS unavailable in this browser.';return;}info.textContent='Waiting for GPS…';watch=navigator.geolocation.watchPosition(p=>{position={coords:L.latLng(p.coords.latitude,p.coords.longitude),accuracy:p.coords.accuracy,timestamp:p.timestamp};if(here)map.removeLayer(here);if(accuracy)map.removeLayer(accuracy);here=L.circleMarker(position.coords,{radius:6,color:'#307db3'}).addTo(map);accuracy=L.circle(position.coords,{radius:p.coords.accuracy,color:'#307db3',weight:1,fillOpacity:.08}).addTo(map);document.getElementById('gps').textContent='Stop GPS';draw();},()=>{info.textContent='Location unavailable. Allow location access in your browser and try again.';navigator.geolocation.clearWatch(watch);watch=undefined;},{enableHighAccuracy:true,maximumAge:0,timeout:15000});};
setInterval(()=>{if(position)draw();},5000);window.addEventListener('pagehide',()=>{if(watch!==undefined)navigator.geolocation.clearWatch(watch);});
</script></body></html>
